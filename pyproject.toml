[project]
name = "iclr-2026-topic-explorer"
version = "0.1.0"
description = "ICLR 2026 Topic Explorer — OpenReview からの論文取得・Gemini API によるトピック分類・GitHub Pages 静的配信"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openreview-py>=1.54.7",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
]


[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
